<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>المنيو الرقمي</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--brand:#0e5a58;--bg:#f7f4ef;--card:#fff;--ink:#2a2420;--mut:#7a6f66;--line:#ece5db;--price:#b4530a;--off:#a99f95;--bad:#b3261e;--ok:#1b7a43;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;line-height:1.6;padding:0 0 env(safe-area-inset-bottom,0px)}
button,input,textarea{font:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 150px}
h1{font-size:1.7rem;margin:22px 0 0}h2{font-size:1.1rem;margin:18px 0 8px}
.sub,.mt{color:var(--mut)}.mt{font-size:.88rem}

/* الرأس */
.hero{margin:0 -16px;padding:calc(34px + env(safe-area-inset-top,0px)) 22px 44px;color:#fff;border-radius:0 0 30px 30px;background:var(--brand);background:linear-gradient(135deg,var(--brand),color-mix(in srgb,var(--brand) 55%,#000))}
.hero h1{margin:0;font-size:2rem;line-height:1.3}
.hero p{margin:6px 0 0;opacity:.9}
.pill{display:inline-block;margin-top:14px;padding:3px 16px;border-radius:999px;background:rgba(255,255,255,.2);font-weight:600}
.sec{font-weight:700;font-size:1.15rem;margin:26px 2px 6px}

/* بطاقة الطبق */
.dish{display:flex;gap:0;background:var(--card);border-radius:18px;margin:12px 0;overflow:hidden;box-shadow:0 2px 10px rgba(60,40,20,.08)}
.dish .pic{width:112px;flex:none;background:#eee;background:color-mix(in srgb,var(--brand) 12%,#fff)}
.dish .pic img{width:100%;height:100%;object-fit:cover;display:block;min-height:112px}
.ph{height:100%;min-height:112px;display:flex;align-items:center;justify-content:center;font-size:2.4rem}
.dish .bd{flex:1;min-width:0;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.dish .nm{font-weight:700;font-size:1.05rem}
.dish .ft{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:6px}
.dish.off .pic{filter:grayscale(1);opacity:.6}.dish.off .nm{color:var(--off)}
.price{color:var(--price);font-weight:700;background:#fdf0e4;padding:2px 12px;border-radius:999px;font-size:.95rem}
.tag{font-size:.85rem;color:var(--off);font-weight:700}
.add{width:42px;height:42px;border-radius:50%;border:0;background:var(--brand);color:#fff;font-size:1.5rem;line-height:1;box-shadow:0 3px 8px rgba(0,0,0,.2)}
.qty{display:flex;align-items:center;gap:6px;background:#f2ece4;border-radius:999px;padding:3px}
.qty button{width:34px;height:34px;border-radius:50%;border:0;background:var(--brand);color:#fff;font-size:1.2rem;line-height:1}
.qty strong{min-width:22px;text-align:center}

/* السلة */
.dock{position:fixed;inset-inline:0;bottom:0;padding:0 12px calc(12px + env(safe-area-inset-bottom,0px));pointer-events:none}
.dock .in{max-width:616px;margin:0 auto;pointer-events:auto}
.cartbtn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;border:0;border-radius:18px;padding:14px 18px;background:var(--brand);color:#fff;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.28)}
.cnt{background:#fff;color:var(--brand);border-radius:999px;min-width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;font-weight:700}
.sheet{background:var(--card);border-radius:20px;padding:16px;box-shadow:0 6px 24px rgba(0,0,0,.3);max-height:75vh;overflow:auto}
.wide{width:100%;margin-top:10px}

/* عام */
.row{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
.nm{font-weight:600}
.sm{border:1.5px solid var(--brand);background:var(--card);color:var(--brand);border-radius:8px;min-width:34px;height:34px;padding:0 12px}
.sm.del{border-color:var(--bad);color:var(--bad)}
.pri{background:var(--brand);color:#fff;border:0;border-radius:12px;padding:13px 22px;font-weight:700}
.pri:disabled{background:var(--off);cursor:not-allowed}
.card{background:var(--card);border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 10px rgba(60,40,20,.08)}
.f{display:flex;flex-direction:column;gap:4px;margin:8px 0}.f label{color:var(--mut);font-size:.9rem}
.f input,.f textarea{padding:11px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tot{font-weight:700;font-size:1.1rem}
.err{color:var(--bad);font-weight:600;margin:6px 0}.okm{color:var(--ok);font-weight:600}
.st{display:inline-block;padding:2px 12px;border-radius:999px;background:#f2ece4;font-size:.85rem;font-weight:600}
.tabs{display:flex;gap:6px;margin:16px 0 4px;flex-wrap:wrap}
.tabs button{padding:7px 16px;border:0;border-radius:999px;background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(60,40,20,.12)}
.tabs button.act{background:var(--brand);color:#fff;font-weight:700}
.foot{margin-top:30px;text-align:center}.foot a{color:var(--mut)}
.lnk{background:none;border:0;color:var(--mut);text-decoration:underline;padding:6px}
#qr{display:inline-block;background:#fff;padding:12px;border-radius:12px;margin-top:8px}
.thumb{width:52px;height:52px;border-radius:12px;object-fit:cover;flex:none;background:#eee}
.thumb.e{display:flex;align-items:center;justify-content:center;font-size:1.5rem}
.lab{display:inline-flex;align-items:center;cursor:pointer}
.sw{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.swb{width:44px;height:44px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line)}
.swb.sel{box-shadow:0 0 0 3px var(--ink)}
</style>
</head>
<body>
<div class="wrap"><main id="app">جارٍ التحميل…</main></div>
<script>
var SB_URL="https://zayfkpqqplzdglmitbjr.supabase.co";
var SB_KEY="sb_publishable_bh09vVqac-KhD4EA6BI_vg_F5WYWhDZ";
var sb=null;
/* بعض البيئات لا تقبل كائن Headers، فنحوّله إلى كائن عادي قبل الإرسال */
function safeFetch(url,opts){
  opts=opts||{};
  var h=opts.headers;
  if(h&&typeof h.forEach==="function"&&!Array.isArray(h)){
    var plain={};h.forEach(function(v,k){plain[k]=v});
    opts=Object.assign({},opts,{headers:plain});
  }
  return fetch(url,opts);
}
try{
  sb=supabase.createClient(SB_URL,SB_KEY,{
    global:{fetch:safeFetch},
    auth:{lock:function(name,timeout,fn){return fn();}}
  });
}catch(e){}

var qs=new URLSearchParams(location.search);
var slug=qs.get("r")||"demo";
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function money(n){return new Intl.NumberFormat("ar-IQ").format(n)+" د.ع"}
var ST=["جديد","قيد التحضير","جاهز","تم التقديم"],NEXT=["ابدأ التحضير","جاهز","تم التقديم"];
function fmtT(t){if(!t)return"";var d=new Date(t),m=Math.round((Date.now()-d.getTime())/60000),s=d.toLocaleString("ar-IQ",{weekday:"long",day:"numeric",month:"long",hour:"numeric",minute:"2-digit"});var r=m<1?"الآن":m<60?"منذ "+m+" دقيقة":m<1440?"منذ "+Math.floor(m/60)+" ساعة":"";return s+(r?" ("+r+")":"")}var COLORS=["#0e5a58","#b3261e","#c2570c","#2e7d32","#1f5fa8","#6a3fa0","#2b2b2b"];
var RCOLS="id,name,slug,color";

var C={rest:null,items:[],cart:{},table:qs.get("table")||"",note:"",err:"",done:null,open:false,loaded:false,busy:false};
var O={user:null,rest:null,items:[],orders:[],tab:"orders",msg:"",info:"",mode:"login",qt:"5",loaded:false,busy:false};

function isOwnerView(){return location.hash==="#owner"}
function hero(name,sub,pill){return '<header class="hero"><h1>'+esc(name)+'</h1>'+(sub?'<p>'+esc(sub)+'</p>':'')+(pill?'<span class="pill">'+esc(pill)+'</span>':'')+'</header>'}
function pic(i){return i.image_url?'<img src="'+esc(i.image_url)+'" alt="" loading="lazy">':'<div class="ph">🍽️</div>'}

/* ---------- الزبون ---------- */
async function loadCustomer(){
  try{
    var r=await sb.from("restaurants").select(RCOLS).eq("slug",slug).maybeSingle();
    if(r.error){C.err="تعذّر قراءة المشروع من قاعدة البيانات. تفاصيل الخطأ: "+(r.error.message||r.error.code||"")+" | "+(r.error.code||"");}
    else if(!r.data){C.err="لم يتم العثور على المشروع باسم «"+slug+"».";}
    else{
      C.rest=r.data;
      var m=await sb.from("menu_items").select("*").eq("restaurant_id",r.data.id).order("name");
      if(m.error)C.err="تعذّر تحميل الأطباق.";else C.items=m.data||[];
    }
  }catch(e){C.err="تعذّر الاتصال. تحقق من الإنترنت.";}
  C.loaded=true;render();
}
function customerHTML(){
  if(!C.loaded)return "جارٍ التحميل…";
  if(C.err&&!C.rest)return '<p class="err">'+C.err+'</p>';
  if(C.done)return hero(C.rest.name,"")+'<div class="card"><h2>تم إرسال طلبك ✅</h2><p>رقم الطلب: <strong>'+C.done.no+'</strong> | طاولة '+esc(C.done.table)+'</p><p>الدفع نقداً عند الاستلام.</p><button class="pri" id="again">طلب إضافي</button></div>';
  var h=hero(C.rest.name,"اختر أطباقك ثم أرسل الطلب",C.table?"طاولة "+C.table:"");
  h+='<div class="sec">القائمة</div>';
  if(!C.items.length)h+='<p class="mt">لا توجد أصناف في المنيو بعد.</p>';
  C.items.forEach(function(i){var q=C.cart[i.id]||0,ctl;
    if(!i.is_available)ctl='<span class="tag">غير متوفر</span>';
    else if(!q)ctl='<button class="add" data-add="'+i.id+'" aria-label="أضف">+</button>';
    else ctl='<div class="qty"><button data-plus="'+i.id+'" aria-label="زيادة">+</button><strong>'+q+'</strong><button data-minus="'+i.id+'" aria-label="إنقاص">−</button></div>';
    h+='<article class="dish'+(i.is_available?'':' off')+'"><div class="pic">'+pic(i)+'</div><div class="bd"><div class="nm">'+esc(i.name)+'</div><div class="mt">⏱ '+(i.prep_minutes||0)+' دقيقة</div><div class="ft"><span class="price">'+money(i.price)+'</span>'+ctl+'</div></div></article>';});
  var ch=C.items.filter(function(i){return C.cart[i.id]});
  if(ch.length){
    var tot=ch.reduce(function(s,i){return s+i.price*C.cart[i.id]},0),pm=ch.reduce(function(m,i){return Math.max(m,i.prep_minutes||0)},0),cnt=ch.reduce(function(s,i){return s+C.cart[i.id]},0);
    h+='<div class="dock"><div class="in">';
    if(C.open){
      h+='<div class="sheet"><div class="row" style="border:0;padding-top:0"><strong>طلبك</strong><button class="lnk" data-open="0">إغلاق</button></div>'
      +ch.map(function(i){return '<div class="row"><span>'+esc(i.name)+' ×'+C.cart[i.id]+'</span><span class="price">'+money(i.price*C.cart[i.id])+'</span></div>'}).join("")
      +'<div class="f"><label for="tb">رقم الطاولة</label><input id="tb" inputmode="numeric" maxlength="10" value="'+esc(C.table)+'"></div>'
      +'<div class="f"><label for="nt">ملاحظات (اختياري)</label><input id="nt" maxlength="200" value="'+esc(C.note)+'"></div>'
      +'<p class="mt">طريقة الدفع: نقداً (الدفع الإلكتروني قريباً)</p>'
      +(C.err?'<p class="err" role="alert">'+C.err+'</p>':'')
      +'<div class="mt">أطول وقت تحضير: حوالي '+pm+' دقيقة</div>'
      +'<button class="pri wide" id="send"'+(C.busy?' disabled':'')+'>'+(C.busy?'جارٍ الإرسال…':'أرسل الطلب · '+money(tot))+'</button></div>';
    }else{
      h+='<button class="cartbtn" data-open="1"><span class="cnt">'+cnt+'</span><span>عرض السلة وإتمام الطلب</span><strong>'+money(tot)+'</strong></button>';
    }
    h+='</div></div>';
  }
  return h+'<p class="foot"><a href="#owner">دخول صاحب المشروع</a></p>';
}
async function sendOrder(){
  C.err="";
  var table=($("tb")?$("tb").value:C.table).trim();C.table=table;C.note=$("nt")?$("nt").value.trim():C.note;
  if(!table){C.err="أدخل رقم الطاولة.";render();return}
  C.busy=true;render();
  try{
    var ids=Object.keys(C.cart);
    var f=await sb.from("menu_items").select("id,name,price,is_available").eq("restaurant_id",C.rest.id).in("id",ids);
    if(f.error)throw f.error;
    var lines=[],total=0;
    for(var k=0;k<ids.length;k++){
      var m=(f.data||[]).find(function(x){return x.id===ids[k]});
      if(!m||!m.is_available){C.err="«"+(m?m.name:"أحد الأطباق")+"» غير متوفر الآن. أزله من الطلب.";C.busy=false;await loadCustomer();return}
      lines.push({name:m.name,q:C.cart[ids[k]],p:m.price});total+=m.price*C.cart[ids[k]];
    }
    var ins=await sb.from("orders").insert({restaurant_id:C.rest.id,table_no:C.note?table+" - "+C.note:table,lines:lines.length?lines:null,total:total,payment:"cash",status:0});
    if(ins.error)throw ins.error;
    C.done={no:String(Date.now()).slice(-4),table:table};C.cart={};C.open=false;
  }catch(e){C.err="تعذّر إرسال الطلب، حاول مرة أخرى.";}
  C.busy=false;render();
}

/* ---------- صاحب المشروع ---------- */
async function initOwner(){
  if(!sb)return;
  var s=await sb.auth.getSession();
  O.user=s.data&&s.data.session?s.data.session.user:null;
  if(O.user)await loadOwner();
  O.loaded=true;render();
}
async function loadOwner(){
  var r=await sb.from("restaurants").select(RCOLS).eq("owner_id",O.user.id).limit(1).maybeSingle();
  O.rest=r.data||null;
  if(O.rest){await loadItems();await loadOrders();}
}
async function loadItems(){var m=await sb.from("menu_items").select("*").eq("restaurant_id",O.rest.id).order("name");O.items=m.data||[];}
async function loadOrders(){var o=await sb.from("orders").select("*").eq("restaurant_id",O.rest.id).order("created_at",{ascending:false}).limit(50);O.orders=o.data||[];}

/* رفع الصور: نصغّر الصورة أولاً لتوفير الإنترنت */
function resizeImg(file,max){return new Promise(function(res,rej){
  var img=new Image(),u=URL.createObjectURL(file);
  img.onload=function(){var s=Math.min(1,max/Math.max(img.width,img.height));
    var c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);
    c.toBlob(function(b){b?res(b):rej(new Error("blob"))},"image/jpeg",0.82);};
  img.onerror=function(){rej(new Error("img"))};img.src=u;});}
async function uploadImg(file){
  try{
    var blob=await resizeImg(file,900);
    var path=O.user.id+"/"+Date.now()+".jpg";
    var r=await sb.storage.from("dishes").upload(path,blob,{contentType:"image/jpeg"});
    if(r.error)throw r.error;
    return sb.storage.from("dishes").getPublicUrl(path).data.publicUrl;
  }catch(e){O.msg="تعذّر رفع الصورة. تأكد أنك شغّلت كود الصور في Supabase.";return null;}
}

function ownerHTML(){
  if(!O.loaded)return "جارٍ التحميل…";
  var msgH=(O.msg?'<p class="err" role="alert">'+O.msg+'</p>':'')+(O.info?'<p class="okm" role="status">'+O.info+'</p>':'');
  if(!O.user){
    if(O.mode==="signup")return '<h1>إنشاء حساب صاحب المشروع</h1><div class="card"><div class="f"><label for="rn">اسم المشروع (Restaurant name)</label><input id="rn" maxlength="60"></div><div class="f"><label for="rs">اسم الرابط بالإنجليزية، مثل: alnakheel (Link name)</label><input id="rs" maxlength="30" dir="ltr" autocapitalize="none"></div><div class="f"><label for="em">البريد الإلكتروني (Email)</label><input id="em" type="email" dir="ltr" autocomplete="username"></div><div class="f"><label for="pw">كلمة السر، 6 أحرف على الأقل (Password)</label><input id="pw" type="password" autocomplete="new-password"></div>'+msgH+'<button class="pri" id="signup">إنشاء الحساب</button></div><p class="foot"><button class="lnk" data-mode="login">لديّ حساب، دخول</button></p>';
    return '<h1>دخول صاحب المشروع</h1><div class="card"><div class="f"><label for="em">البريد الإلكتروني (Email)</label><input id="em" type="email" dir="ltr" autocomplete="username"></div><div class="f"><label for="pw">كلمة السر (Password)</label><input id="pw" type="password" autocomplete="current-password"></div>'+msgH+'<button class="pri" id="login">دخول</button></div><p class="foot"><button class="lnk" data-mode="signup">ليس لديك حساب؟ إنشاء حساب جديد</button></p><p class="foot"><a href="#">العودة إلى المنيو</a></p>';
  }
  if(!O.rest)return '<h1>أنشئ المشروعك</h1><div class="card"><p class="mt">حسابك جاهز. أدخل بيانات المشروعك لتبدأ.</p><div class="f"><label for="rn">اسم المشروع (Restaurant name)</label><input id="rn" maxlength="60"></div><div class="f"><label for="rs">اسم الرابط بالإنجليزية، مثل: alnakheel (Link name)</label><input id="rs" maxlength="30" dir="ltr" autocapitalize="none"></div>'+msgH+'<button class="pri" id="mkRest">إنشاء المشروع</button></div><p class="foot"><button class="lnk" data-t="out">خروج</button></p>';
  var open=O.orders.filter(function(o){return o.status<3}).length;
  var h=hero(O.rest.name,"لوحة التحكم")+'<div class="tabs"><button data-t="orders" class="'+(O.tab==="orders"?'act':'')+'">الطلبات ('+open+')</button><button data-t="items" class="'+(O.tab==="items"?'act':'')+'">الأطباق</button><button data-t="look" class="'+(O.tab==="look"?'act':'')+'">المظهر</button><button data-t="qr" class="'+(O.tab==="qr"?'act':'')+'">رمز QR</button><button data-t="out">خروج</button></div>';
  if(O.tab==="orders"){
    if(!O.orders.length)h+='<p class="mt">لا توجد طلبات بعد. تتحدث القائمة تلقائياً كل 10 ثوانٍ.</p>';
    O.orders.forEach(function(o){var ls=(o.lines||[]).map(function(l){return esc(l.name)+' ×'+l.q}).join("، ");
      h+='<div class="card"><div class="row" style="border:0;padding:0"><strong>طاولة '+esc(o.table_no)+'</strong><span class="st">'+ST[o.status]+'</span></div><div class="mt">🕒 '+fmtT(o.created_at)+'</div><div class="mt">'+ls+'</div><div class="row" style="border:0;padding-bottom:0"><span class="price">'+money(o.total)+'</span>'+(o.status<3?'<button class="sm" data-adv="'+o.id+'" data-st="'+o.status+'">'+NEXT[o.status]+'</button>':'')+'</div></div>';});
  }
  if(O.tab==="items"){
    h+='<div class="card"><strong>إضافة طبق</strong><div class="grid"><div class="f"><label for="n1">الاسم</label><input id="n1" maxlength="60"></div><div class="f"><label for="p1">السعر (د.ع)</label><input id="p1" inputmode="numeric"></div></div><div class="f"><label for="m1">وقت التحضير (دقائق)</label><input id="m1" inputmode="numeric"></div><div class="f"><label for="im">صورة الطبق (اختياري)</label><input id="im" type="file" accept="image/*"></div>'+msgH+'<button class="pri" id="addItem">إضافة</button></div>';
    O.items.forEach(function(i){h+='<div class="row">'+(i.image_url?'<img class="thumb" src="'+esc(i.image_url)+'" alt="">':'<div class="thumb e">🍽️</div>')+'<div style="flex:1;min-width:0"><div class="nm">'+esc(i.name)+'</div><div class="mt">'+money(i.price)+' | '+(i.prep_minutes||0)+' دقيقة</div></div><div class="qty" style="background:none"><label class="sm lab">صورة<input type="file" accept="image/*" data-img="'+i.id+'" hidden></label><button class="sm" data-tog="'+i.id+'">'+(i.is_available?'متوفر':'غير متوفر')+'</button><button class="sm del" data-del="'+i.id+'">حذف</button></div></div>';});
  }
  if(O.tab==="look"){
    h+='<div class="card"><strong>لون المشروعك</strong><p class="mt">يظهر في رأس المنيو والأزرار عند الزبائن.</p><div class="sw">'+COLORS.map(function(c){return '<button class="swb'+(O.rest.color===c?' sel':'')+'" style="background:'+c+'" data-color="'+c+'" aria-label="لون"></button>'}).join("")+'</div>'+msgH+'</div>';
  }
  if(O.tab==="qr")h+='<div class="card"><div class="f"><label for="qt">رقم الطاولة</label><input id="qt" inputmode="numeric" value="'+esc(O.qt)+'"></div><p class="mt">اطبع الرمز وضعه على الطاولة. عند مسحه يفتح المنيو وتُسجَّل الطاولة تلقائياً.</p><div id="qr"></div></div>';
  return h+'<p class="foot"><a href="#">عرض المنيو كزبون</a></p>';
}
function drawQR(){var b=$("qr");if(!b||!O.rest)return;b.innerHTML="";
  var url=location.origin+location.pathname+"?r="+encodeURIComponent(O.rest.slug)+"&table="+encodeURIComponent(O.qt);
  try{new QRCode(b,{text:url,width:180,height:180});}catch(e){b.textContent="تعذّر رسم الرمز";}
  var p=document.createElement("p");p.className="mt";p.style.wordBreak="break-all";p.textContent=url;b.parentNode.appendChild(p);}

/* ---------- العرض ---------- */
function render(){
  if(!sb){$("app").innerHTML='<p class="err">تعذّر تحميل مكتبة الاتصال. تحقق من الإنترنت وأعد المحاولة.</p>';return}
  var col=(isOwnerView()?(O.rest&&O.rest.color):(C.rest&&C.rest.color))||"#0e5a58";
  if(!/^#[0-9a-f]{6}$/i.test(col))col="#0e5a58";
  document.documentElement.style.setProperty("--brand",col);
  $("app").innerHTML=isOwnerView()?ownerHTML():customerHTML();
  if(isOwnerView()&&O.user&&O.rest&&O.tab==="qr")drawQR();
}
var SLUG=/^[a-z0-9-]{3,30}$/;
async function createRest(name,slg){
  var r=await sb.from("restaurants").insert({owner_id:O.user.id,name:name,slug:slg}).select(RCOLS).single();
  if(r.error){O.msg=r.error.code==="23505"?"اسم الرابط مستخدم، اختر اسماً آخر.":"تعذّر إنشاء المشروع، حاول مرة أخرى.";return false}
  O.rest=r.data;O.items=[];O.orders=[];O.tab="items";return true;
}
async function act(fn){O.msg="";O.info="";try{await fn();}catch(e){O.msg="حدث خطأ، حاول مرة أخرى.";}render();}

document.addEventListener("click",function(e){
  var t=e.target.closest("button");if(!t)return;var d=t.dataset;
  if(d.open!==undefined){C.open=d.open==="1";C.err="";render();return}
  if(d.add||d.plus){var id=d.add||d.plus;C.cart[id]=Math.min(20,(C.cart[id]||0)+1);C.err="";render();return}
  if(d.minus){var q=(C.cart[d.minus]||1)-1;if(q<1)delete C.cart[d.minus];else C.cart[d.minus]=q;if(!Object.keys(C.cart).length)C.open=false;render();return}
  if(d.mode){O.mode=d.mode;O.msg="";O.info="";render();return}
  if(t.id==="again"){C.done=null;render();return}
  if(t.id==="signup"){act(async function(){
    var n=$("rn").value.trim(),sl=$("rs").value.trim().toLowerCase(),em=$("em").value.trim(),pw=$("pw").value;
    if(!n||!SLUG.test(sl)){O.msg="اكتب اسم المشروع، واسم الرابط بحروف إنجليزية صغيرة وأرقام فقط (3 أحرف على الأقل).";return}
    if(pw.length<6){O.msg="كلمة السر يجب أن تكون 6 أحرف على الأقل.";return}
    var r=await sb.auth.signUp({email:em,password:pw});
    if(r.error){O.msg="تعذّر إنشاء الحساب. تأكد من صحة البريد، أو أنه غير مسجّل من قبل.";return}
    if(r.data.session){O.user=r.data.user;await createRest(n,sl);}
    else{O.mode="login";O.info="تم إنشاء الحساب. افتح بريدك وأكّد الرسالة، ثم ادخل وسيطلب منك إنشاء المشروعك.";}
  });return}
  if(t.id==="mkRest"){act(async function(){
    var n=$("rn").value.trim(),sl=$("rs").value.trim().toLowerCase();
    if(!n||!SLUG.test(sl)){O.msg="اكتب اسم المشروع، واسم الرابط بحروف إنجليزية صغيرة وأرقام فقط (3 أحرف على الأقل).";return}
    await createRest(n,sl);
  });return}
  if(t.id==="send"){sendOrder();return}
  if(t.id==="login"){act(async function(){
    var r=await sb.auth.signInWithPassword({email:$("em").value.trim(),password:$("pw").value});
    if(r.error){O.msg="البريد أو كلمة السر غير صحيحة.";return}
    O.user=r.data.user;await loadOwner();});return}
  if(d.t){if(d.t==="out"){act(async function(){await sb.auth.signOut();O.user=null;O.rest=null;O.items=[];O.orders=[];O.tab="orders"});}else{O.tab=d.t;O.msg="";render();}return}
  if(t.id==="addItem"){act(async function(){
    var n=$("n1").value.trim(),p=parseInt($("p1").value,10),m=parseInt($("m1").value,10)||10;
    if(!n||!(p>=0)){O.msg="اكتب اسم الطبق وسعراً صحيحاً.";return}
    var url=null,fl=$("im").files[0];
    if(fl){url=await uploadImg(fl);if(!url)return;}
    var r=await sb.from("menu_items").insert({restaurant_id:O.rest.id,name:n,price:p,prep_minutes:m,is_available:true,image_url:url});
    if(r.error)throw r.error;await loadItems();});return}
  if(d.color){act(async function(){
    var r=await sb.from("restaurants").update({color:d.color}).eq("id",O.rest.id);
    if(r.error){O.msg="تعذّر حفظ اللون. تأكد أنك شغّلت كود التحديث في Supabase.";return}
    O.rest.color=d.color;});return}
  if(d.tog){act(async function(){var it=O.items.find(function(x){return x.id===d.tog});
    var r=await sb.from("menu_items").update({is_available:!it.is_available}).eq("id",d.tog);if(r.error)throw r.error;await loadItems();});return}
  if(d.del){if(!confirm("حذف هذا الطبق؟"))return;act(async function(){
    var r=await sb.from("menu_items").delete().eq("id",d.del);if(r.error)throw r.error;await loadItems();});return}
  if(d.adv){act(async function(){
    var r=await sb.from("orders").update({status:parseInt(d.st,10)+1}).eq("id",d.adv);if(r.error)throw r.error;await loadOrders();});return}
});
document.addEventListener("change",function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.img&&t.files&&t.files[0]){
    var id=t.dataset.img,fl=t.files[0];
    act(async function(){
      var url=await uploadImg(fl);if(!url)return;
      var r=await sb.from("menu_items").update({image_url:url}).eq("id",id);
      if(r.error)throw r.error;await loadItems();});
  }
});
document.addEventListener("input",function(e){
  if(e.target.id==="tb")C.table=e.target.value;
  if(e.target.id==="nt")C.note=e.target.value;
  if(e.target.id==="qt"){O.qt=e.target.value;drawQR()}
});
window.addEventListener("hashchange",function(){render()});
setInterval(function(){
  if(isOwnerView()&&O.user&&O.rest&&O.tab==="orders"&&!document.hidden){
    loadOrders().then(render).catch(function(){});}
},10000);

if(sb){loadCustomer();initOwner();}else render();
</script>
</body>
</html>
